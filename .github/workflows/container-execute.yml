name: Container Execution
run-name: Container execution ${{ inputs.execution_id }}

on:
  workflow_dispatch:
    inputs:
      execution_id:
        description: Correlation ID generated by the MCP service
        required: true
        type: string
      target:
        description: Allowlisted execution target
        required: true
        type: choice
        options: [unit, lint, security]
      source_ref:
        description: Source branch or tag to test as untrusted input data
        required: true
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: container-execution-${{ inputs.execution_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate execution inputs
        id: validate
        shell: bash
        env:
          EXECUTION_ID: ${{ inputs.execution_id }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$EXECUTION_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "execution_id must be a 32-character lowercase hex UUID" >&2
            exit 2
          fi
          if [[ -z "$SOURCE_REF" || "$SOURCE_REF" == -* || "$SOURCE_REF" == *..* ]]; then
            echo "source_ref is invalid" >&2
            exit 2
          fi
          git check-ref-format --branch "$SOURCE_REF" >/dev/null
          mkdir -p execution-result
          : > execution-result/stdout.log
          : > execution-result/stderr.log
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted workflow revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build trusted test runtime image
        run: docker build --pull --tag code-test-lab:${{ github.sha }} .

      - name: Checkout source under test as untrusted data
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false
          clean: true

      - name: Run allowlisted target in restricted container
        id: execute
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          IMAGE: code-test-lab:${{ github.sha }}
        run: |
          set -uo pipefail
          case "$TARGET" in
            unit) TEST_COMMAND='python -m pytest -q -p no:cacheprovider tests' ;;
            lint) TEST_COMMAND='ruff check --no-cache src tests' ;;
            security) TEST_COMMAND='python -m pytest -q -p no:cacheprovider tests/security' ;;
            *) echo "Unsupported target" >&2; exit 2 ;;
          esac

          set +e
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --memory 2g --cpus 2 --pids-limit 256 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user 10001:10001 \
            --workdir /workspace/source \
            --mount "type=bind,src=$GITHUB_WORKSPACE/source,dst=/workspace/source,readonly" \
            --env PYTHONPATH=/workspace/source/src \
            --env TARGET="$TARGET" \
            "$IMAGE" sh -lc "$TEST_COMMAND" \
            > execution-result/stdout.log 2> execution-result/stderr.log
          exit_code=$?
          printf '%s\n' "$exit_code" > execution-result/exit_code.txt
          exit "$exit_code"

      - name: Record execution metadata
        if: always() && steps.validate.outputs.valid == 'true'
        shell: bash
        env:
          EXECUTION_ID: ${{ inputs.execution_id }}
          TARGET: ${{ inputs.target }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          exit_code="$(cat execution-result/exit_code.txt 2>/dev/null || echo 255)"
          source_commit="$(git -C source rev-parse HEAD 2>/dev/null || echo unknown)"
          printf 'execution_id=%s\ntarget=%s\nsource_ref=%s\ncommit_sha=%s\nexit_code=%s\n' \
            "$EXECUTION_ID" "$TARGET" "$SOURCE_REF" "$source_commit" "$exit_code" \
            > execution-result/metadata.txt

      - name: Upload execution result
        if: always() && steps.validate.outputs.valid == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: execution-${{ inputs.execution_id }}
          path: execution-result/
          if-no-files-found: error
          retention-days: 7
