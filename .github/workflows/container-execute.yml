name: Container Execution
run-name: Container execution ${{ inputs.execution_id }}

on:
  workflow_dispatch:
    inputs:
      execution_id:
        description: Correlation ID generated by the MCP service
        required: true
        type: string
      target:
        description: Allowlisted execution target
        required: true
        type: choice
        options: [unit, lint, security]

permissions:
  contents: read

concurrency:
  group: container-execution-${{ inputs.execution_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted repository revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build isolated test image
        run: docker build --pull --tag code-test-lab:${{ github.sha }} .

      - name: Run allowlisted target in restricted container
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            unit) TEST_COMMAND='python -m pytest -q' ;;
            lint) TEST_COMMAND='ruff check src tests' ;;
            security) TEST_COMMAND='python -m compileall -q src && python -m pytest -q tests/security' ;;
            *) echo "Unsupported target" >&2; exit 2 ;;
          esac
          docker run --rm             --network none             --read-only             --tmpfs /tmp:rw,noexec,nosuid,size=256m             --memory 2g --cpus 2 --pids-limit 256             --cap-drop ALL             --security-opt no-new-privileges             --user 10001:10001             --env TARGET="$TARGET"             code-test-lab:${{ github.sha }}             sh -lc "$TEST_COMMAND"

      - name: Record execution metadata
        if: always()
        run: |
          mkdir -p execution-result
          printf 'execution_id=%s\ntarget=%s\ncommit=%s\n'             '${{ inputs.execution_id }}' '${{ inputs.target }}' '${{ github.sha }}'             > execution-result/metadata.txt

      - name: Upload execution metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-${{ inputs.execution_id }}
          path: execution-result/
          if-no-files-found: error
          retention-days: 7
