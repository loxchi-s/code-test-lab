name: Container Execution
run-name: Container execution ${{ inputs.execution_id }}

on:
  workflow_dispatch:
    inputs:
      execution_id:
        description: Correlation ID generated by the MCP service
        required: true
        type: string
      target:
        description: Allowlisted execution target
        required: true
        type: choice
        options: [unit, lint, security]

permissions:
  contents: read

concurrency:
  group: container-execution-${{ inputs.execution_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate execution identifier
        id: validate
        env:
          EXECUTION_ID: ${{ inputs.execution_id }}
        run: |
          if [[ ! "$EXECUTION_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "execution_id must be a 32-character lowercase hex UUID" >&2
            exit 2
          fi
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted repository revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build isolated test image
        run: docker build --pull --tag code-test-lab:${{ github.sha }} .

      - name: Run allowlisted target in restricted container
        env:
          EXECUTION_ID: ${{ inputs.execution_id }}
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            unit) TEST_COMMAND='python -m pytest -q -p no:cacheprovider' ;;
            lint) TEST_COMMAND='ruff check --no-cache src tests' ;;
            security) TEST_COMMAND='python -m pytest -q -p no:cacheprovider tests/security' ;;
            *) echo "Unsupported target" >&2; exit 2 ;;
          esac
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --memory 2g --cpus 2 --pids-limit 256 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user 10001:10001 \
            --env TARGET="$TARGET" \
            code-test-lab:${{ github.sha }} \
            sh -lc "$TEST_COMMAND"

      - name: Record execution metadata
        if: always() && steps.validate.outputs.valid == 'true'
        env:
          EXECUTION_ID: ${{ inputs.execution_id }}
          TARGET: ${{ inputs.target }}
        run: |
          mkdir -p execution-result
          printf 'execution_id=%s\ntarget=%s\ncommit=%s\n' \
            "$EXECUTION_ID" "$TARGET" "$GITHUB_SHA" \
            > execution-result/metadata.txt

      - name: Upload execution metadata
        if: always() && steps.validate.outputs.valid == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: execution-${{ inputs.execution_id }}
          path: execution-result/
          if-no-files-found: error
          retention-days: 7
