name: Workflow Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    name: GitHub Actions syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" \
            | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          sudo install actionlint /usr/local/bin/actionlint
      - name: Lint workflows
        run: actionlint -color

  gitleaks:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" \
            | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan all commits using trusted base-branch rules
        env:
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          trusted_base="$TRUSTED_BASE_SHA"
          trusted_dir="$RUNNER_TEMP/trusted-gitleaks"
          git worktree add --detach "$trusted_dir" "$trusted_base"

          trusted_config="$trusted_dir/.gitleaks.toml"
          if [ ! -f "$trusted_config" ]; then
            {
              echo '[extend]'
              echo 'useDefault = true'
            } > "$trusted_config"
          fi

          trusted_ignore="$trusted_dir/.gitleaksignore"
          if [ ! -f "$trusted_ignore" ]; then
            : > "$trusted_ignore"
          fi

          cd "$trusted_dir"
          gitleaks git . \
            --config "$trusted_config" \
            --gitleaks-ignore-path "$trusted_ignore" \
            --ignore-gitleaks-allow \
            --redact --no-banner \
            --log-opts="--all --full-history --diff-filter=uxdbT --diff-merges=first-parent"

  zizmor:
    name: GitHub Actions security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Create isolated tool environment
        run: python -I -m venv "${{ runner.temp }}/zizmor-venv"
      - name: Install pinned zizmor outside the checkout
        run: "${{ runner.temp }}/zizmor-venv/bin/python -I -m pip install --disable-pip-version-check zizmor==1.32.0"
      - name: Audit workflow security
        run: "${{ runner.temp }}/zizmor-venv/bin/zizmor --no-config --no-ignores --collect=all --format=github --min-severity=high ."
        env:
          GH_TOKEN: ${{ github.token }}
