name: Workflow Security

on:
  pull_request:
  push:
    branches: [main, "feat/**", "chore/**"]

permissions:
  contents: read

jobs:
  workflow-security:
    name: Workflow lint and security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint GitHub Actions workflows
        run: actionlint -color

      - name: Install zizmor
        run: python -m pip install --disable-pip-version-check "zizmor==1.32.0"

      - name: Audit GitHub Actions security
        run: zizmor --format=github --min-severity=high .
        env:
          GH_TOKEN: ${{ github.token }}
