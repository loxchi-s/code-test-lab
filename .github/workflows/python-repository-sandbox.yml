name: Python Repository Sandbox

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Public GitHub repository (owner/repository). Private repositories are rejected to protect test output."
        required: true
        type: string
      ref:
        description: "Branch, tag, or commit to test."
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  python-sandbox:
    name: Checkout, prepare, and test external Python repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout trusted sandbox harness
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: sandbox-harness
          persist-credentials: false
          fetch-depth: 1

      - name: Validate target repository input
        id: validate-target
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_REF: ${{ inputs.ref }}
        run: |
          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }
          TARGET_REPOSITORY="$(trim "$TARGET_REPOSITORY")"
          TARGET_REF="$(trim "$TARGET_REF")"
          if [[ ! "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
            echo "::error::repository must use owner/repository format"
            exit 2
          fi
          if [[ -z "$TARGET_REF" || "$TARGET_REF" =~ [[:space:]] ]]; then
            echo "::error::ref must be non-empty and must not contain whitespace"
            exit 2
          fi
          {
            printf 'repository=%s\n' "$TARGET_REPOSITORY"
            printf 'ref=%s\n' "$TARGET_REF"
          } >> "$GITHUB_OUTPUT"
          metadata="$(curl --fail --silent --show-error --location --connect-timeout 5 --max-time 15 \
            "https://api.github.com/repos/$TARGET_REPOSITORY")" || {
            echo "::error::target repository must be publicly accessible"
            exit 2
          }
          visibility="$(jq -r '.visibility // "unknown"' <<< "$metadata")"
          if [[ "$visibility" != "public" ]]; then
            echo "::error::private target repositories are not supported because harness log readers may not have access"
            exit 2
          fi

      - name: Checkout target repository into isolated workspace
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.validate-target.outputs.repository }}
          ref: ${{ steps.validate-target.outputs.ref }}
          path: target-repository
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Build trusted Python sandbox image
        id: build-image
        working-directory: sandbox-harness
        run: docker build --pull --tag "code-test-lab-python:${GITHUB_SHA}" .

      - name: Verify Docker daemon resource-limit support
        id: docker-capabilities
        if: ${{ steps.build-image.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          info="$(docker info --format '{{json .}}')"
          if ! jq -e '
            type == "object"
            and .PidsLimit == true
            and .MemoryLimit == true
            and .SwapLimit == true
          ' <<< "$info" >/dev/null; then
            echo "::error::Docker daemon must explicitly support PID, memory, and swap limits"
            exit 2
          fi
          if jq -e '(.Warnings // []) | any(.[]; test("pids limit"; "i"))' <<< "$info" >/dev/null; then
            echo "::error::Docker daemon reports that PID limits are unsupported"
            exit 2
          fi

      - name: Create size-bounded target tmpfs volume
        id: prepare-workspace
        if: ${{ steps.docker-capabilities.outcome == 'success' }}
        run: |
          volume="code-test-lab-target-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create --driver local \
            --opt type=tmpfs --opt device=tmpfs \
            --opt o=size=2g,uid=10001,gid=10001 "$volume"
          printf 'volume=%s\n' "$volume" >> "$GITHUB_OUTPUT"

      - name: Prepare target dependencies in restricted network container
        id: prepare-dependencies
        if: ${{ steps.prepare-workspace.outcome == 'success' }}
        timeout-minutes: 15
        env:
          TARGET_VOLUME: ${{ steps.prepare-workspace.outputs.volume }}
          PREP_CONTAINER: python-target-prepare-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          marker="$(cat /proc/sys/kernel/random/uuid)"
          restore_workflow_commands() {
            local exit_code=$?
            trap - EXIT
            printf '\n::%s::\n' "$marker"
            exit "$exit_code"
          }
          trap restore_workflow_commands EXIT
          printf '::stop-commands::%s\n' "$marker"
          docker run --rm --name "$PREP_CONTAINER" \
            --network bridge \
            --read-only \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/target-repository,dst=/input/target,readonly" \
            --mount "type=volume,src=${TARGET_VOLUME},dst=/sandbox" \
            --workdir /sandbox \
            --tmpfs /tmp:rw,nosuid,size=1g \
            --memory 4g --memory-swap 4g --cpus 2 --pids-limit 256 \
            --log-driver json-file --log-opt max-size=10m --log-opt max-file=3 \
            --env HTTP_PROXY= --env HTTPS_PROXY= --env ALL_PROXY= --env FTP_PROXY= --env NO_PROXY= \
            --env http_proxy= --env https_proxy= --env all_proxy= --env ftp_proxy= --env no_proxy= \
            --env HOME=/tmp --env PIP_NO_CACHE_DIR=1 --env PIP_DISABLE_PIP_VERSION_CHECK=1 \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 \
            --entrypoint /bin/sh \
            "code-test-lab-python:${GITHUB_SHA}" \
            -ec 'mkdir /sandbox/source
            cp -R /input/target/. /sandbox/source/
            cd /sandbox/source
            python -m venv /sandbox/venv
            /sandbox/venv/bin/python -m pip install --no-cache-dir --only-binary=:all: --disable-pip-version-check --editable ".[dev]"
            /sandbox/venv/bin/python -c "from pathlib import Path; import pytest; print(\"Prepared pytest from:\", pytest.__file__); source = Path(\"/sandbox/source/src\"); module = Path(pytest.__file__).resolve(); assert not (source / \"pytest\" / \"__init__.py\").is_file() or module.is_relative_to(source), \"pytest did not resolve from the target source tree\""' 2>&1

      - name: Run target pytest suite without network or credentials
        if: ${{ steps.prepare-dependencies.outcome == 'success' }}
        timeout-minutes: 20
        env:
          TARGET_VOLUME: ${{ steps.prepare-workspace.outputs.volume }}
          TEST_CONTAINER: python-target-test-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          marker="$(cat /proc/sys/kernel/random/uuid)"
          restore_workflow_commands() {
            local exit_code=$?
            trap - EXIT
            printf '\n::%s::\n' "$marker"
            exit "$exit_code"
          }
          trap restore_workflow_commands EXIT
          printf '::stop-commands::%s\n' "$marker"
          docker run --rm --name "$TEST_CONTAINER" \
            --network none \
            --read-only \
            --mount "type=volume,src=${TARGET_VOLUME},dst=/sandbox,readonly" \
            --workdir /sandbox/source \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --memory 2g --memory-swap 2g --cpus 2 --pids-limit 256 \
            --log-driver json-file --log-opt max-size=10m --log-opt max-file=3 \
            --env HTTP_PROXY= --env HTTPS_PROXY= --env ALL_PROXY= --env FTP_PROXY= --env NO_PROXY= \
            --env http_proxy= --env https_proxy= --env all_proxy= --env ftp_proxy= --env no_proxy= \
            --env XDG_CACHE_HOME=/tmp/cache \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 \
            --entrypoint /sandbox/venv/bin/python \
            "code-test-lab-python:${GITHUB_SHA}" \
            -I -B -m pytest -q -p no:cacheprovider /sandbox/source 2>&1

      - name: Remove prepared target containers and tmpfs volume
        if: ${{ always() }}
        env:
          PREP_CONTAINER: python-target-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          TEST_CONTAINER: python-target-test-${{ github.run_id }}-${{ github.run_attempt }}
          TARGET_VOLUME: ${{ steps.prepare-workspace.outputs.volume }}
        run: |
          docker rm -f "$PREP_CONTAINER" "$TEST_CONTAINER" >/dev/null 2>&1 || true
          if [[ -n "$TARGET_VOLUME" && "$TARGET_VOLUME" == code-test-lab-target-* ]]; then
            docker volume rm "$TARGET_VOLUME" >/dev/null 2>&1 || true
          fi
