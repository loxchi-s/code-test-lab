name: Python Repository Sandbox

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Public GitHub repository (owner/repository). Private repositories are rejected to protect test output."
        required: true
        type: string
      ref:
        description: "Branch, tag, or commit to test."
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  python-sandbox:
    name: Checkout, prepare, and test external Python repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout trusted sandbox harness
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: sandbox-harness
          persist-credentials: false
          fetch-depth: 1

      - name: Validate target repository input
        id: validate-target
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_REF: ${{ inputs.ref }}
        run: |
          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }
          TARGET_REPOSITORY="$(trim "$TARGET_REPOSITORY")"
          TARGET_REF="$(trim "$TARGET_REF")"
          if [[ ! "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
            echo "::error::repository must use owner/repository format"
            exit 2
          fi
          if [[ -z "$TARGET_REF" || "$TARGET_REF" =~ [[:space:]] ]]; then
            echo "::error::ref must be non-empty and must not contain whitespace"
            exit 2
          fi
          {
            printf 'repository=%s\n' "$TARGET_REPOSITORY"
            printf 'ref=%s\n' "$TARGET_REF"
          } >> "$GITHUB_OUTPUT"
          metadata="$(curl --fail --silent --show-error --location --connect-timeout 5 --max-time 15 \
            "https://api.github.com/repos/$TARGET_REPOSITORY")" || {
            echo "::error::target repository must be publicly accessible"
            exit 2
          }
          visibility="$(jq -r '.visibility // "unknown"' <<< "$metadata")"
          if [[ "$visibility" != "public" ]]; then
            echo "::error::private target repositories are not supported because harness log readers may not have access"
            exit 2
          fi

      - name: Checkout target repository into isolated workspace
        id: checkout-target
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.validate-target.outputs.repository }}
          ref: ${{ steps.validate-target.outputs.ref }}
          path: target-repository
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Build trusted Python sandbox image
        id: build-image
        working-directory: sandbox-harness
        run: docker build --pull --tag "code-test-lab-python:${GITHUB_SHA}" .

      - name: Verify Docker daemon resource-limit support
        id: docker-capabilities
        if: ${{ steps.build-image.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          info="$(docker info --format '{{json .}}')"
          if ! jq -e '
            type == "object"
            and .PidsLimit == true
            and .MemoryLimit == true
            and .SwapLimit == true
          ' <<< "$info" >/dev/null; then
            echo "::error::Docker daemon must explicitly support PID, memory, and swap limits"
            exit 2
          fi
          if jq -e '(.Warnings // []) | any(.[]; test("pids limit"; "i"))' <<< "$info" >/dev/null; then
            echo "::error::Docker daemon reports that PID limits are unsupported"
            exit 2
          fi

      - name: Create size-bounded host tmpfs workspace
        id: prepare-workspace
        if: ${{ steps.docker-capabilities.outcome == 'success' }}
        run: |
          workspace="$(mktemp -d "$RUNNER_TEMP/python-target.XXXXXX")"
          printf 'workspace=%s\n' "$workspace" >> "$GITHUB_OUTPUT"
          sudo mount -t tmpfs -o size=2g,uid=10001,gid=10001,mode=0755 tmpfs "$workspace"

      - name: Prepare target dependencies in restricted network container
        id: prepare-dependencies
        if: ${{ steps.prepare-workspace.outcome == 'success' }}
        timeout-minutes: 15
        env:
          TARGET_WORKSPACE: ${{ steps.prepare-workspace.outputs.workspace }}
          TARGET_COMMIT: ${{ steps.checkout-target.outputs.commit }}
          PREP_CONTAINER: python-target-prepare-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          marker="$(cat /proc/sys/kernel/random/uuid)"
          restore_workflow_commands() {
            local exit_code=$?
            trap - EXIT
            printf '\n::%s::\n' "$marker"
            exit "$exit_code"
          }
          trap restore_workflow_commands EXIT
          printf '::stop-commands::%s\n' "$marker"
          docker run --rm --name "$PREP_CONTAINER" \
            --network bridge \
            --read-only \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/target-repository,dst=/input/target,readonly" \
            --mount "type=bind,src=${TARGET_WORKSPACE},dst=/sandbox" \
            --workdir /sandbox \
            --tmpfs /tmp:rw,nosuid,size=1g \
            --memory 4g --memory-swap 4g --cpus 2 --pids-limit 256 \
            --log-driver json-file --log-opt max-size=10m --log-opt max-file=3 \
            --env HTTP_PROXY= --env HTTPS_PROXY= --env ALL_PROXY= --env FTP_PROXY= --env NO_PROXY= \
            --env http_proxy= --env https_proxy= --env all_proxy= --env ftp_proxy= --env no_proxy= \
            --env "TARGET_COMMIT=${TARGET_COMMIT}" \
            --env HOME=/tmp --env PIP_NO_CACHE_DIR=1 --env PIP_DISABLE_PIP_VERSION_CHECK=1 \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 \
            --entrypoint /bin/sh \
            "code-test-lab-python:${GITHUB_SHA}" \
            -ec 'python -I -m code_test_lab.target_preparation --source /input/target --destination /sandbox/source --commit-sha "$TARGET_COMMIT" --requirements-file /tmp/target-requirements.txt --distribution-file /tmp/target-distribution
            cd /sandbox/source
            python -m venv /sandbox/venv
            /sandbox/venv/bin/python -m pip install --no-cache-dir --only-binary=:all: --disable-pip-version-check --requirement /tmp/target-requirements.txt
            IFS= read -r TARGET_DISTRIBUTION < /tmp/target-distribution
            if /sandbox/venv/bin/python -I -c "import importlib.metadata as metadata, sys; metadata.version(sys.argv[1])" "$TARGET_DISTRIBUTION" >/dev/null 2>&1; then
              TARGET_SEED_VERSION=$(/sandbox/venv/bin/python -I -c "import importlib.metadata as metadata, sys; print(metadata.version(sys.argv[1]))" "$TARGET_DISTRIBUTION")
              /sandbox/venv/bin/python -m pip uninstall --yes "$TARGET_DISTRIBUTION"
            else
              TARGET_SEED_VERSION=""
            fi
            python -I -m code_test_lab.target_preparation --source /sandbox/source --commit-sha "$TARGET_COMMIT" --seed-version "$TARGET_SEED_VERSION" --env-file /tmp/scm-overrides
            while IFS= read -r override; do
              case "$override" in
                SETUPTOOLS_SCM_PRETEND_VERSION=*|SETUPTOOLS_SCM_PRETEND_VERSION_FOR_*|VCS_VERSIONING_PRETEND_VERSION_FOR_*)
                  export "$override"
                  ;;
                *)
                  echo "::error::target preparation returned an invalid environment variable"
                  exit 2
                  ;;
              esac
            done < /tmp/scm-overrides
            /sandbox/venv/bin/python -m pip install --no-cache-dir --only-binary=:all: --disable-pip-version-check --no-deps --editable .
            /sandbox/venv/bin/python -c "from pathlib import Path; import pytest; print(\"Prepared pytest from:\", pytest.__file__); source = Path(\"/sandbox/source\"); module = Path(pytest.__file__).resolve(); package_dirs = (source / \"src\", source); assert not any((root / \"pytest\" / \"__init__.py\").is_file() for root in package_dirs) or any(module.is_relative_to(root) for root in package_dirs), \"pytest did not resolve from the target source tree\""' 2>&1

      - name: Resolve target distribution with trusted metadata parser
        id: target-metadata
        if: ${{ steps.prepare-dependencies.outcome == 'success' }}
        timeout-minutes: 2
        env:
          TARGET_COMMIT: ${{ steps.checkout-target.outputs.commit }}
        run: |
          metadata_file="$(mktemp "$RUNNER_TEMP/target-distribution.XXXXXX")"
          trap 'rm -f "$metadata_file"' EXIT
          docker run --rm \
            --network none \
            --read-only \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/target-repository,dst=/input/target,readonly" \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --memory 512m --memory-swap 512m --cpus 1 --pids-limit 64 \
            --log-driver json-file --log-opt max-size=1m --log-opt max-file=1 \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 \
            --env "TARGET_COMMIT=${TARGET_COMMIT}" \
            --entrypoint /bin/sh \
            "code-test-lab-python:${GITHUB_SHA}" \
            -ec 'python -I -m code_test_lab.target_preparation --source /input/target --commit-sha "$TARGET_COMMIT" --distribution-file /tmp/target-distribution >/dev/null
            cat /tmp/target-distribution' > "$metadata_file"
          distribution="$(cat "$metadata_file")"
          distribution="${distribution,,}"
          if [[ ! "$distribution" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
            echo "::error::trusted metadata parser returned an invalid distribution name"
            exit 2
          fi
          printf 'distribution=%s\n' "$distribution" >> "$GITHUB_OUTPUT"

      - name: Run target pytest suite without network or credentials
        if: ${{ steps.target-metadata.outcome == 'success' }}
        timeout-minutes: 20
        env:
          TARGET_WORKSPACE: ${{ steps.prepare-workspace.outputs.workspace }}
          TARGET_SOURCE: ${{ github.workspace }}/target-repository
          TARGET_DISTRIBUTION: ${{ steps.target-metadata.outputs.distribution }}
          TEST_CONTAINER: python-target-test-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          marker="$(cat /proc/sys/kernel/random/uuid)"
          restore_workflow_commands() {
            local exit_code=$?
            trap - EXIT
            printf '\n::%s::\n' "$marker"
            exit "$exit_code"
          }
          trap restore_workflow_commands EXIT
          printf '::stop-commands::%s\n' "$marker"
          docker run --rm --name "$TEST_CONTAINER" \
            --network none \
            --read-only \
            --mount "type=bind,src=${TARGET_WORKSPACE},dst=/sandbox,readonly" \
            --mount "type=bind,src=${TARGET_SOURCE},dst=/input/target,readonly" \
            --workdir /input/target \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --memory 2g --memory-swap 2g --cpus 2 --pids-limit 256 \
            --log-driver json-file --log-opt max-size=10m --log-opt max-file=3 \
            --env HTTP_PROXY= --env HTTPS_PROXY= --env ALL_PROXY= --env FTP_PROXY= --env NO_PROXY= \
            --env http_proxy= --env https_proxy= --env all_proxy= --env ftp_proxy= --env no_proxy= \
            --env XDG_CACHE_HOME=/tmp/cache \
            --env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            --env "TARGET_DISTRIBUTION=${TARGET_DISTRIBUTION}" \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 \
            --entrypoint /bin/sh \
            "code-test-lab-python:${GITHUB_SHA}" \
            -ec 'if [ "$TARGET_DISTRIBUTION" = "pytest" ]; then
              exec /opt/trusted-runner/bin/python -I -B /opt/trusted-runner/trusted_test_runner.py --source /input/target --venv /sandbox/venv --target-pytest
            fi
            exec /opt/trusted-runner/bin/python -I -B /opt/trusted-runner/trusted_test_runner.py --source /input/target --venv /sandbox/venv' 2>&1

      - name: Remove prepared target containers and unmount tmpfs workspace
        if: ${{ always() }}
        env:
          PREP_CONTAINER: python-target-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          TEST_CONTAINER: python-target-test-${{ github.run_id }}-${{ github.run_attempt }}
          TARGET_WORKSPACE: ${{ steps.prepare-workspace.outputs.workspace }}
        run: |
          docker rm -f "$PREP_CONTAINER" "$TEST_CONTAINER" >/dev/null 2>&1 || true
          if [[ -n "$TARGET_WORKSPACE" && "$TARGET_WORKSPACE" == "$RUNNER_TEMP"/python-target.* ]]; then
            if mountpoint -q "$TARGET_WORKSPACE"; then
              sudo umount "$TARGET_WORKSPACE"
            fi
            rmdir "$TARGET_WORKSPACE" 2>/dev/null || true
          fi
