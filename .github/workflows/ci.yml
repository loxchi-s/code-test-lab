name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Build and validate in restricted containers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build validation image
        id: build-image
        run: docker build --pull --tag code-test-lab:${{ github.sha }} .

      - name: Run quality checks without network or credentials
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --memory 2g --memory-swap 2g --cpus 2 --pids-limit 256 \
            --log-driver json-file --log-opt max-size=10m --log-opt max-file=3 \
            --env HTTP_PROXY= --env HTTPS_PROXY= --env ALL_PROXY= --env FTP_PROXY= --env NO_PROXY= \
            --env http_proxy= --env https_proxy= --env all_proxy= --env ftp_proxy= --env no_proxy= \
            --env PYTHONPYCACHEPREFIX=/tmp/pycache --env XDG_CACHE_HOME=/tmp/cache \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 \
            --entrypoint /bin/sh \
            code-test-lab:${{ github.sha }} \
            -ec 'ruff check --no-cache src tests
            lint-imports --no-cache
            python -m pytest -q -p no:cacheprovider
            python -m compileall -q src
            mypy --cache-dir=/tmp/mypy_cache src
            bandit -r src'

      - name: Install trusted Syft image scanner
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' }}
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/anchore/syft/releases/download/v1.57.1/syft_1.57.1_linux_amd64.tar.gz \
            --output syft.tar.gz
          echo "bf52519eb57f675d47c07d43213cb6dff6449f3d6d1147ff6701ed91f44eef0c  syft.tar.gz" \
            | sha256sum --check
          tar -xzf syft.tar.gz syft
          sudo install syft /usr/local/bin/syft

      - name: Generate SBOM from the image without executing it
        id: image-sbom
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' }}
        run: syft "code-test-lab:${{ github.sha }}" -o "cyclonedx-json=$RUNNER_TEMP/image-sbom.json"

      - name: Convert SBOM Python packages into pinned requirements data
        id: image-requirements
        if: ${{ !cancelled() && steps.image-sbom.outcome == 'success' }}
        run: |
          python - "$RUNNER_TEMP/image-sbom.json" "$RUNNER_TEMP/image-requirements.txt" <<'PY'
          import json
          import re
          import sys

          source, destination = sys.argv[1:]
          with open(source, encoding="utf-8") as stream:
              sbom = json.load(stream)

          components = sbom.get("components")
          if not isinstance(components, list):
              raise SystemExit("SBOM has no valid components list")

          packages = {}
          for component in components:
              if not isinstance(component, dict):
                  continue
              purl = component.get("purl")
              if not isinstance(purl, str) or not purl.startswith("pkg:pypi/"):
                  continue
              name = component.get("name")
              version = component.get("version")
              if (
                  not isinstance(name, str)
                  or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,199}", name)
                  or not isinstance(version, str)
                  or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9.+!_-]{0,99}", version)
              ):
                  raise SystemExit("SBOM contains an invalid Python package identity")
              key = name.casefold()
              previous = packages.get(key)
              if previous is not None and previous[1] != version:
                  raise SystemExit(f"SBOM reports multiple versions of {name}")
              packages[key] = (name, version)

          if not packages:
              raise SystemExit("SBOM contains no auditable PyPI packages")

          with open(destination, "w", encoding="utf-8") as stream:
              for name, version in sorted(packages.values(), key=lambda item: item[0].casefold()):
                  stream.write(f"{name}=={version}\\n")
          PY

      - name: Audit image inventory with trusted pip-audit action
        if: ${{ !cancelled() && steps.image-requirements.outcome == 'success' }}
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: ${{ runner.temp }}/image-requirements.txt
          disable-pip: true
          no-deps: true
