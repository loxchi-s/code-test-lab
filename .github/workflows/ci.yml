name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**", "chore/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest -q
      - run: python -m compileall -q src
      - run: mypy src
      - run: pip-audit
      - run: bandit -r src

  container-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install policy runner
        run: python -m pip install -e ".[dev]"
      - name: Build isolated test image
        run: docker build --pull --tag code-test-lab:${{ github.sha }} .
      - name: Run unit and security tests using repository policy
        run: |
          python -m code_test_lab.isolation \
            --policy config/test-policy.yml \
            --image code-test-lab:${{ github.sha }} \
            -- python -m pytest -q -p no:cacheprovider
      - name: Run lint using repository policy
        run: |
          python -m code_test_lab.isolation \
            --policy config/test-policy.yml \
            --image code-test-lab:${{ github.sha }} \
            -- ruff check --no-cache src tests
