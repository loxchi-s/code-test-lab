name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Build and validate in restricted containers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build validation image
        id: build-image
        run: docker build --pull --tag code-test-lab:${{ github.sha }} .

      - name: Run quality checks without network or credentials
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --memory 2g --memory-swap 2g --cpus 2 --pids-limit 256 \
            --log-driver json-file --log-opt max-size=10m --log-opt max-file=3 \
            --env HTTP_PROXY= --env HTTPS_PROXY= --env ALL_PROXY= \
            --env http_proxy= --env https_proxy= --env all_proxy= \
            --env PYTHONPYCACHEPREFIX=/tmp/pycache --env XDG_CACHE_HOME=/tmp/cache \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 \
            --entrypoint /bin/sh \
            code-test-lab:${{ github.sha }} \
            -ec 'ruff check --no-cache src tests
            lint-imports --no-cache
            python -m pytest -q -p no:cacheprovider
            python -m compileall -q src
            mypy --cache-dir=/tmp/mypy_cache src
            bandit -r src'

      - name: Audit installed dependencies in a restricted network container
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' }}
        run: |
          docker run --rm \
            --network bridge \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --memory 1g --memory-swap 1g --cpus 1 --pids-limit 128 \
            --log-driver json-file --log-opt max-size=10m --log-opt max-file=2 \
            --env HTTP_PROXY= --env HTTPS_PROXY= --env ALL_PROXY= \
            --env http_proxy= --env https_proxy= --env all_proxy= \
            --env XDG_CACHE_HOME=/tmp/cache \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 \
            --entrypoint pip-audit \
            code-test-lab:${{ github.sha }}
