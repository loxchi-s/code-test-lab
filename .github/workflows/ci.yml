name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Build and validate in restricted containers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build validation image
        id: build-image
        run: docker build --pull --tag code-test-lab:${{ github.sha }} .

      - name: Verify Docker daemon PID limit support
        if: ${{ steps.build-image.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          warnings="$(docker info --format '{{json .Warnings}}')"
          if ! jq -e '(. == null) or (type == "array")' <<< "$warnings" >/dev/null; then
            echo "::error::Docker daemon returned invalid capability warnings"
            exit 2
          fi
          if jq -e 'type == "array" and any(.[]; test("pids limit"; "i"))' <<< "$warnings" >/dev/null; then
            echo "::error::Docker daemon does not support PID limits"
            exit 2
          fi

      - name: Run quality checks without network or credentials
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --memory 2g --memory-swap 2g --cpus 2 --pids-limit 256 \
            --log-driver json-file --log-opt max-size=10m --log-opt max-file=3 \
            --env HTTP_PROXY= --env HTTPS_PROXY= --env ALL_PROXY= --env FTP_PROXY= --env NO_PROXY= \
            --env http_proxy= --env https_proxy= --env all_proxy= --env ftp_proxy= --env no_proxy= \
            --env PYTHONPYCACHEPREFIX=/tmp/pycache --env XDG_CACHE_HOME=/tmp/cache \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 \
            --entrypoint /bin/sh \
            code-test-lab:${{ github.sha }} \
            -ec 'ruff check --no-cache src tests
            lint-imports --no-cache
            python -m pytest -q -p no:cacheprovider
            python -m compileall -q src
            mypy --cache-dir=/tmp/mypy_cache src
            bandit -r src'

      - name: Smoke test restricted Python repository sandbox
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          fixture="$(mktemp -d "$RUNNER_TEMP/sandbox-smoke.XXXXXX")"
          trap 'rm -rf "$fixture"' EXIT
          chmod 777 "$fixture"
          cat > "$fixture/test_sandbox_smoke.py" <<'PY'
          import errno
          import os
          from pathlib import Path

          import pytest


          def test_pytest_is_loaded_from_trusted_image() -> None:
              assert "/workspace/target/" not in str(Path(pytest.__file__).resolve())


          def test_target_mount_is_read_only() -> None:
              with pytest.raises(OSError) as error:
                  Path("/workspace/target/.write-probe").write_text("must fail")
              assert error.value.errno == errno.EROFS


          def test_container_runs_as_non_root() -> None:
              assert os.getuid() == 10001
          PY

          docker run --rm \
            --network none --read-only \
            --mount "type=bind,src=$fixture,dst=/workspace/target,readonly" \
            --workdir /workspace/target \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --memory 2g --memory-swap 2g --cpus 2 --pids-limit 256 \
            --log-driver json-file --log-opt max-size=10m --log-opt max-file=3 \
            --env HTTP_PROXY= --env HTTPS_PROXY= --env ALL_PROXY= --env FTP_PROXY= --env NO_PROXY= \
            --env http_proxy= --env https_proxy= --env all_proxy= --env ftp_proxy= --env no_proxy= \
            --env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 --env XDG_CACHE_HOME=/tmp/cache \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 \
            --entrypoint python \
            "code-test-lab:${{ github.sha }}" \
            -I -c 'import sys; sys.dont_write_bytecode = True; import pytest; sys.path.insert(0, "/workspace/target"); raise SystemExit(pytest.main(["-q", "-p", "no:cacheprovider", "/workspace/target"]))'

      - name: Install trusted Syft image scanner
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' }}
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/anchore/syft/releases/download/v1.57.1/syft_1.57.1_linux_amd64.tar.gz \
            --output syft.tar.gz
          echo "bf52519eb57f675d47c07d43213cb6dff6449f3d6d1147ff6701ed91f44eef0c  syft.tar.gz" \
            | sha256sum --check
          tar -xzf syft.tar.gz syft
          sudo install syft /usr/local/bin/syft

      - name: Generate SBOM from the image without executing it
        id: image-sbom
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' }}
        run: |
          printf '{}' > "$RUNNER_TEMP/syft-empty.yaml"
          cd "$RUNNER_TEMP"
          syft --config "$RUNNER_TEMP/syft-empty.yaml" \
            "code-test-lab:${{ github.sha }}" \
            -o "cyclonedx-json=$RUNNER_TEMP/image-sbom.json"

      - name: Filter SBOM to PyPI packages using trusted parser
        id: python-sbom
        if: ${{ !cancelled() && steps.image-sbom.outcome == 'success' }}
        run: |
          python - "$RUNNER_TEMP/image-sbom.json" "$RUNNER_TEMP/python-sbom.json" <<'PY'
          import json
          import sys

          source, destination = sys.argv[1:]
          with open(source, encoding="utf-8") as stream:
              sbom = json.load(stream)

          components = sbom.get("components")
          if not isinstance(components, list):
              raise SystemExit("SBOM has no valid components list")

          python_components = [
              component
              for component in components
              if isinstance(component, dict)
              and isinstance(component.get("purl"), str)
              and component["purl"].startswith("pkg:pypi/")
          ]
          if not python_components:
              raise SystemExit("SBOM contains no PyPI package components")

          sbom["components"] = python_components
          sbom.pop("dependencies", None)
          with open(destination, "w", encoding="utf-8") as stream:
              json.dump(sbom, stream)
          PY

      - name: Install trusted Grype vulnerability scanner
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' }}
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/anchore/grype/releases/download/v0.122.0/grype_0.122.0_linux_amd64.tar.gz \
            --output grype.tar.gz
          echo "e697e6f7224637df87e267e4318cc027feae99a8e1b80280241d32b9ee5d4920  grype.tar.gz" \
            | sha256sum --check
          tar -xzf grype.tar.gz grype
          sudo install grype /usr/local/bin/grype

      - name: Scan image SBOM with trusted Grype
        if: ${{ !cancelled() && steps.python-sbom.outcome == 'success' }}
        run: |
          printf '{}' > "$RUNNER_TEMP/grype-empty.yaml"
          cd "$RUNNER_TEMP"
          grype --config "$RUNNER_TEMP/grype-empty.yaml" \
            "sbom:$RUNNER_TEMP/python-sbom.json" --fail-on low
