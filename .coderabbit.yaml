language: "en-US"

reviews:
  profile: "assertive"
  auto_review:
    enabled: true
    drafts: true
  path_instructions:
    - path: "**/*.py"
      instructions: |
        Review this repository using the five Architecture Health Check dimensions:
        1. Modularity: keep modules cohesive and small; identify God modules and circular dependencies.
        2. Boundaries: business/domain logic must not directly depend on frameworks, databases,
           network clients, or UI; use ports and adapters where those integrations are required.
        3. Coupling: dependency direction must point toward the core; reject broad shared/util modules
           that become dependency hubs.
        4. Cohesion: filenames, functions, and packages must accurately reflect their responsibilities.
        5. Testability: business logic must be unit-testable without a database or network.

        For every finding, state severity, affected file/line, concrete failure mode, and a minimal fix.
        Distinguish confirmed defects from design suggestions. Do not claim a test was run unless
        the workflow output proves it. Do not suggest adding MCP servers, MCP clients, or remote
        execution services to this repository.
    - path: ".github/workflows/**"
      instructions: |
        Review workflow changes for least-privilege permissions, untrusted pull-request execution,
        expression-to-shell injection, credential persistence, mutable action references,
        secret exposure, and unsafe use of pull_request_target. Never recommend exposing secrets
        to pull-request test containers.
