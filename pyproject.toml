[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "code-test-lab"
version = "0.1.0"
description = "Policy-bounded container execution service backed by GitHub Actions."
requires-python = ">=3.12"
dependencies = ["mcp>=1.9,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
container-mcp = "container_execution.adapters.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/container_execution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
