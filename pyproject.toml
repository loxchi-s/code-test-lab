[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "code-test-lab"
version = "0.3.2"
description = "Sandbox-first isolated code testing harness with GitHub Actions CI."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "bandit>=1.7",
  "PyYAML>=6.0",
  "types-PyYAML>=6.0",
  "import-linter==2.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/code_test_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
